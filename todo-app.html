<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #999;
            font-size: 0.95em;
        }

        .input-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .todo-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .todo-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-btn {
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            color: #666;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.95em;
            color: #666;
        }

        .todo-list {
            list-style: none;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .todo-item.completed {
            opacity: 0.6;
            border-left-color: #4caf50;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: #999;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .todo-text {
            flex: 1;
            color: #333;
            font-size: 1em;
        }

        .delete-btn {
            padding: 6px 12px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        .actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .clear-btn,
        .delete-all-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #666;
        }

        .clear-btn:disabled,
        .delete-all-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            header h1 {
                font-size: 2em;
            }

            .input-section {
                flex-direction: column;
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <input 
                type="text" 
                id="todoInput" 
                placeholder="Add a new task..." 
                class="todo-input"
            >
            <button id="addBtn" class="add-btn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="stats">
            <span>Total: <strong id="totalCount">0</strong></span>
            <span>Completed: <strong id="completedCount">0</strong></span>
            <span>Remaining: <strong id="remainingCount">0</strong></span>
        </div>

        <ul id="todoList" class="todo-list"></ul>

        <div class="empty-state" id="emptyState">
            <p>📭 No tasks yet. Add one to get started!</p>
        </div>

        <div class="actions">
            <button id="clearCompleted" class="clear-btn">Clear Completed</button>
            <button id="deleteAll" class="delete-all-btn">Delete All</button>
        </div>
    </div>

    <script>
        /**
         * To-Do List Application
         * Local Storage Functionality
         */

        class TodoApp {
            constructor() {
                this.todos = [];
                this.currentFilter = 'all';
                this.storageKey = 'todoList_data';
                this.init();
            }

            init() {
                this.loadFromLocalStorage();
                this.setupEventListeners();
                this.render();
            }

            setupEventListeners() {
                document.getElementById('addBtn').addEventListener('click', () => this.addTodo());
                document.getElementById('todoInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.addTodo();
                });

                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.filter;
                        this.render();
                    });
                });

                document.getElementById('clearCompleted').addEventListener('click', () => this.clearCompleted());
                document.getElementById('deleteAll').addEventListener('click', () => this.deleteAll());
            }

            addTodo() {
                const input = document.getElementById('todoInput');
                const text = input.value.trim();

                if (text === '') {
                    alert('Please enter a task!');
                    return;
                }

                const todo = {
                    id: Date.now(),
                    text: text,
                    completed: false,
                    createdAt: new Date().toLocaleString()
                };

                this.todos.unshift(todo);
                this.saveToLocalStorage();
                this.render();
                input.value = '';
                input.focus();
            }

            toggleTodo(id) {
                const todo = this.todos.find(t => t.id === id);
                if (todo) {
                    todo.completed = !todo.completed;
                    this.saveToLocalStorage();
                    this.render();
                }
            }

            deleteTodo(id) {
                if (confirm('Delete this task?')) {
                    this.todos = this.todos.filter(t => t.id !== id);
                    this.saveToLocalStorage();
                    this.render();
                }
            }

            clearCompleted() {
                const completedCount = this.todos.filter(t => t.completed).length;
                if (completedCount === 0) {
                    alert('No completed tasks!');
                    return;
                }
                if (confirm(`Delete ${completedCount} completed task(s)?`)) {
                    this.todos = this.todos.filter(t => !t.completed);
                    this.saveToLocalStorage();
                    this.render();
                }
            }

            deleteAll() {
                if (this.todos.length === 0) {
                    alert('No tasks to delete!');
                    return;
                }
                if (confirm(`Delete all ${this.todos.length} task(s)?`)) {
                    this.todos = [];
                    this.saveToLocalStorage();
                    this.render();
                }
            }

            getFilteredTodos() {
                switch (this.currentFilter) {
                    case 'active':
                        return this.todos.filter(t => !t.completed);
                    case 'completed':
                        return this.todos.filter(t => t.completed);
                    case 'all':
                    default:
                        return this.todos;
                }
            }

            render() {
                this.renderTodoList();
                this.updateStats();
                this.updateEmptyState();
                this.updateButtonStates();
            }

            renderTodoList() {
                const todoList = document.getElementById('todoList');
                const filteredTodos = this.getFilteredTodos();

                todoList.innerHTML = '';

                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `todo-item ${todo.completed ? 'completed' : ''}`;
                    li.innerHTML = `
                        <input 
                            type="checkbox" 
                            class="checkbox" 
                            ${todo.completed ? 'checked' : ''} 
                            onchange="app.toggleTodo(${todo.id})"
                        >
                        <span class="todo-text">${this.escapeHtml(todo.text)}</span>
                        <button class="delete-btn" onclick="app.deleteTodo(${todo.id})">Delete</button>
                    `;
                    todoList.appendChild(li);
                });
            }

            updateStats() {
                const total = this.todos.length;
                const completed = this.todos.filter(t => t.completed).length;
                const remaining = total - completed;

                document.getElementById('totalCount').textContent = total;
                document.getElementById('completedCount').textContent = completed;
                document.getElementById('remainingCount').textContent = remaining;
            }

            updateEmptyState() {
                const emptyState = document.getElementById('emptyState');
                const todoList = document.getElementById('todoList');

                if (this.getFilteredTodos().length === 0) {
                    emptyState.classList.add('show');
                    todoList.style.display = 'none';
                } else {
                    emptyState.classList.remove('show');
                    todoList.style.display = 'block';
                }
            }

            updateButtonStates() {
                const clearBtn = document.getElementById('clearCompleted');
                const deleteBtn = document.getElementById('deleteAll');

                clearBtn.disabled = !this.todos.some(t => t.completed);
                deleteBtn.disabled = this.todos.length === 0;
            }

            saveToLocalStorage() {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(this.todos));
                } catch (e) {
                    console.error('Error saving to local storage:', e);
                }
            }

            loadFromLocalStorage() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    this.todos = data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error('Error loading from local storage:', e);
                    this.todos = [];
                }
            }

            escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return text.replace(/[&<>"']/g, m => map[m]);
            }
        }

        let app;
        document.addEventListener('DOMContentLoaded', () => {
            app = new TodoApp();
        });
    </script>
</body>
</html>
